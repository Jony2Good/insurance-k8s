apiVersion: apps/v1
kind: Deployment
metadata:
  name: policy-error-event
  namespace: k8s-basics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: policy-error-event
  template:
    metadata:
      labels:
        app: policy-error-event
    spec:
      initContainers:
        - name: wait-for-php
          image: alpine:3.18
          command: ['sh', '-c', 'apk add --no-cache netcat-openbsd && until nc -z policy-php-service 9000; do echo "Waiting for policy-php-service..."; sleep 2; done;']
      containers:
        - name: policy-error-event
          image: atrem2023/policy-service-v2:amd64
          command: ["php", "artisan", "app:error-event"]      
          env:
          - name: RABBITMQ_HOST
            value: "rabbitmq"
          - name: RABBITMQ_PORT
            value: "5672"