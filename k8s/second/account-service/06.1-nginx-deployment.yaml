apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service-nginx-deploy
  namespace: k8s-basics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: account-service-nginx-deploy
  template:
    metadata:
      labels:
        app: account-service-nginx-deploy
    spec:
      containers:
        - name: nginx
          image: atrem2023/app-nginx:amd64
          ports:
            - containerPort: 80
          volumeMounts:
            - name: account-service-nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /api/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/ready
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: account-service-nginx-config
          configMap:
            name: account-service-nginx-config
