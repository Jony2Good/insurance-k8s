server:
  resources:
    requests:
      cpu: "100m"
      memory: "200Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

  persistentVolume:
    enabled: false

  retention: "24h"

alertmanager:
  enabled: false

pushgateway:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false